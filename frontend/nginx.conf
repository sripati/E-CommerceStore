server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving upstreams per request (via variables) lets
    # nginx start even if a backend container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $user_service    http://user-service:3001;
    set $product_service http://product-service:3002;
    set $cart_service    http://cart-service:3003;
    set $order_service   http://order-service:3004;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend liveness
    location = /health {
        default_type text/plain;
        return 200 "Frontend is Live\n";
    }

    # ---- API routing (paths do not overlap between services) ----
    location /api/auth/       { proxy_pass $user_service; }
    location /api/users/      { proxy_pass $user_service; }
    location /api/products    { proxy_pass $product_service; }
    location /api/categories  { proxy_pass $product_service; }
    location /api/cart/       { proxy_pass $cart_service; }
    location /api/orders      { proxy_pass $order_service; }
    location /api/payments/   { proxy_pass $order_service; }

    # ---- Backend status checks through the public frontend ----
    # e.g. /services/user/ -> user-service:3001/  ("User Service Running")
    #      /services/user/health -> user-service:3001/health
    location /services/user/    { rewrite ^/services/user(/.*)$    $1 break; proxy_pass $user_service; }
    location /services/product/ { rewrite ^/services/product(/.*)$ $1 break; proxy_pass $product_service; }
    location /services/cart/    { rewrite ^/services/cart(/.*)$    $1 break; proxy_pass $cart_service; }
    location /services/order/   { rewrite ^/services/order(/.*)$   $1 break; proxy_pass $order_service; }

    # ---- React SPA: fall back to index.html for client-side routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
